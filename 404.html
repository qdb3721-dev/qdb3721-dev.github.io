<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 · 页面走丢了</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .lost { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 14px; padding: 24px; }
    .lost__code {
      font-size: clamp(4.5rem, 18vw, 9rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(100deg, var(--accent), var(--accent-2) 50%, var(--accent-3));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .lost p { color: var(--muted); }
    .lost .btn { justify-self: center; margin-top: 8px; }
  </style>
</head>
<body>
  <main class="lost">
    <div class="lost__code">404</div>
    <h1>这个页面走丢了</h1>
    <p>你要找的内容不存在,或者已经被搬走了。</p>
    <a class="btn btn--primary" href="/">回到首页</a>
  </main>
</body>
</html>
